[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "geocoder"
version = "1.0.2"
requires-python = ">=3.9"
dependencies = [
    "pyyaml",
    "requests",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.hatch.build.targets.wheel]
packages = ["src/geocoder"]
